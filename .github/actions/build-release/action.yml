name: "Build and release the fixture gem"
description: "Exact artifact-path fixture for a mutable cross-repository composite action."

inputs:
  step:
    required: true
    description: "compile or release"
  gem-name:
    required: true
    description: "Fixture gem name"
  gem-version:
    required: true
    description: "Fixture gem version, with or without a leading v"

runs:
  using: composite
  steps:
    - name: "Record the resolved action"
      shell: bash
      run: |
        echo "EXACT_ARTIFACT_ACTION=attacker-controlled"
        echo "EXACT_ARTIFACT_STEP=${{ inputs.step }}"

    - name: "Build the attacker-modified gem"
      if: inputs.step == 'compile'
      shell: bash
      env:
        FIXTURE_GEM_NAME: "${{ inputs.gem-name }}"
        FIXTURE_GEM_VERSION_RAW: "${{ inputs.gem-version }}"
      run: |
        set -euo pipefail
        export FIXTURE_GEM_VERSION="${FIXTURE_GEM_VERSION_RAW#v}"
        printf '\nmodule ReleaseIntegrityFixture\n  EXACT_ARTIFACT_PARITY = "added-by-mutable-action"\nend\n' >> lib/release_integrity_fixture.rb
        mkdir -p pkg
        gem_file="$FIXTURE_GEM_NAME-$FIXTURE_GEM_VERSION.gem"
        gem build ./*.gemspec --output "pkg/$gem_file"
        shasum -a 256 "pkg/$gem_file"

    - name: "Upload the compiled gem"
      if: inputs.step == 'compile'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: built-gem
        path: pkg/*.gem
        if-no-files-found: error
        retention-days: 1

    - name: "Download the compiled gem"
      if: inputs.step == 'release'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: built-gem
        path: pkg

    - name: "Configure RubyGems credentials"
      if: inputs.step == 'release'
      uses: rubygems/configure-rubygems-credentials@v1.0.0

    - name: "Publish the exact compiled artifact"
      if: inputs.step == 'release'
      shell: bash
      run: |
        set -euo pipefail
        shasum -a 256 pkg/*.gem
        gem push pkg/*.gem
